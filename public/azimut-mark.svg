<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Азимут">
  <defs>
    <clipPath id="dial">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
  </defs>

  <!-- лимб -->
  <circle cx="32" cy="32" r="28" fill="#022622"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#0F534C" stroke-width="2"/>

  <!-- отметка севера -->
  <path d="M32 5.5 L34.6 10.5 L29.4 10.5 Z" fill="#ECC371"/>

  <!-- дуга азимута: от севера до направления стрелки (45°) -->
  <path d="M32 15 A17 17 0 0 1 44.02 19.98"
        fill="none" stroke="#ECC371" stroke-width="2.5"
        stroke-linecap="round" opacity="0.55"/>

  <!-- стрелка пеленга, 45° -->
  <g transform="rotate(45 32 32)">
    <path d="M32 8 L38 32 L32 38 L26 32 Z" fill="#ECC371"/>
    <path d="M32 56 L26 32 L32 38 L38 32 Z" fill="#2BBAAC"/>
  </g>

  <circle cx="32" cy="32" r="3.4" fill="#022622"/>
  <circle cx="32" cy="32" r="3.4" fill="none" stroke="#ECC371" stroke-width="1.6"/>
</svg>
